<html lang="en">

    <title>Apex Imports MW | Premium Vehicle Sourcing</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151D30;
            --accent-gold: #D4AF37;
            --accent-blue: #3B82F6;
            --text-light: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent-gold);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav ul a:hover {
            color: var(--accent-gold);
        }
